spring:
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/farm_mall?serverTimezone=Asia/Shanghai
    username: root
    password: ${数据库密码:}

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 200ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false   # nack 时 requeue=false → 进死信
        retry:
          enabled: true
          max-attempts: 3   #本地重试3次
          initial-interval: 1000



  ai:
    deepseek:
      api-key: ${deepseek-api:}
      base-url: https://api.deepseek.com