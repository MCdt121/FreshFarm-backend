spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/farm_mall?serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  data:
    redis:
     host: localhost
     port: 6379
     timeout: 2000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: redis://localhost:6379
          timeout: 2000 
          # 只重试 1 次
          retryAttempts: 1 
